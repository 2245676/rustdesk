name: XN Linux Wayland build only

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Exact build workflow commit
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  XN_INTEGRATION_SHA: e300777ecada7c3b49725b1778fe0d8db4031865
  RUST_VERSION: "1.75"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  generate-bridge:
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          # Default bridge for every platform still on Flutter 3.24.5 (generated with 3.22.3).
          - {
              target: x86_64-unknown-linux-gnu,
              os: ubuntu-22.04,
              extra-build-args: "",
              flutter-version: "3.22.3",
              artifact-name: "bridge-artifact",
            }
    steps:
      - name: Verify the selected branch and commit
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          test "$GITHUB_REPOSITORY" = 2245676/rustdesk
          test "$GITHUB_REF" = refs/heads/codex/wayland-deb-build-20261113
          test "$GITHUB_SHA" = "$EXPECTED_SOURCE_SHA"
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install prerequisites
        run: |
          sudo apt-get install ca-certificates -y
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            curl \
            gcc \
            git \
            g++ \
            libclang-dev \
            libgtk-3-dev \
            llvm-dev \
            nasm \
            ninja-build \
            pkg-config \
            wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: bridge-${{ matrix.job.os }}

      - name: Cache Bridge
        id: cache-bridge
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: /tmp/flutter_rust_bridge
          key: bridge-${{ matrix.job.flutter-version }}

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ matrix.job.flutter-version }}
          cache: true

      - name: Install flutter rust bridge deps
        shell: bash
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          if [[ "${{ matrix.job.flutter-version }}" == "3.22.3" ]]; then
            # Default Flutter 3.22.3: extended_text 14 needs a newer Dart, so downgrade for resolution.
            sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          else
            # Flutter 3.44 bridge for Windows/macOS arm64: match those builds' source/pubspec state so
            # the generated *.freezed.dart compiles against the same Flutter/freezed they resolve.
            bash .github/patches/apply_flutter_3.44_source_patches.sh
          fi
          pushd flutter && flutter pub get && popd

      - name: Run flutter rust bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.job.artifact-name }}
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h

  build-rustdesk-linux-drm:
    needs: [generate-bridge]
    name: build rustdesk linux drm x86_64
    runs-on: ubuntu-22.04
    steps:
      - name: Verify the selected branch and commit
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          test "$GITHUB_REPOSITORY" = 2245676/rustdesk
          test "$GITHUB_REF" = refs/heads/codex/wayland-deb-build-20261113
          test "$GITHUB_SHA" = "$EXPECTED_SOURCE_SHA"
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Maximize build space
        run: |
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo apt-get update -y
          sudo apt-get install -y nasm
          sudo apt-get install -y qemu-user-static

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
          fetch-depth: 2
          persist-credentials: false

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@49819abfb41bd9b44fb781159c033dba90353a7c # v1.0
        with:
          swap-size-gb: 12

      - name: Free Space
        run: |
          df -h
          free -m

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: "rustfmt"

      - name: Save Rust toolchain version
        run: |
          RUST_TOOLCHAIN_VERSION=$(cargo --version | awk '{print $2}')
          echo "RUST_TOOLCHAIN_VERSION=$RUST_TOOLCHAIN_VERSION" >> $GITHUB_ENV

      - name: Disable rust bridge build
        run: |
          # only build cdylib
          sed -i  "s/\[\"cdylib\", \"staticlib\", \"rlib\"\]/\[\"cdylib\"\]/g" Cargo.toml

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          sudo apt install -y libva-dev && apt show libva-dev
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet x64-linux \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-x64-linux-rel-out.log" || true
        shell: bash

      # The container's meson is too old to build libdrmtap, so build it here from the pin in
      # build.py and hand the .so to the container below via DRMTAP_PREBUILT_DIR.
      - name: Build libdrmtap
        run: |
          sudo apt-get install -y meson ninja-build pkg-config \
            libdrm-dev libegl1-mesa-dev libgles2-mesa-dev
          python3 - <<'PY'
          import importlib.util, sys
          spec = importlib.util.spec_from_file_location("b", "build.py")
          b = importlib.util.module_from_spec(spec)
          sys.argv = ["build.py"]
          spec.loader.exec_module(b)
          print(f"::notice::built {b.build_libdrmtap_so()}")
          PY
        shell: bash

      - uses: rustdesk-org/run-on-arch-action@d3fcfbb632b84cf7f6bc772bfaaa2c2f4f8789a8 # no release tag; commit 2026-05-26
        name: Build rustdesk
        id: vcpkg
        with:
          arch: x86_64
          distro: ubuntu18.04
          setup: |
            ls -l "${PWD}"
            ls -l /opt/artifacts/vcpkg/installed
          dockerRunArgs: |
            --volume "${PWD}:/workspace"
            --volume "/opt/artifacts:/opt/artifacts"
          shell: /bin/bash
          install: |
            apt-get update -y
            echo -e "installing deps"
            apt-get install -y \
               build-essential \
               clang \
               cmake \
               curl \
               gcc \
               git \
               g++ \
               libayatana-appindicator3-dev \
               libasound2-dev \
               libclang-10-dev \
               libgstreamer1.0-dev \
               libgstreamer-plugins-base1.0-dev \
               libgtk-3-dev \
               libpulse-dev \
               libva-dev \
               libxcb-randr0-dev \
               libxcb-shape0-dev \
               libxcb-xfixes0-dev \
               libxdo-dev \
               libxfixes-dev \
               llvm-10-dev \
               nasm \
               ninja-build \
               pkg-config \
               tree \
               python3 \
               rpm \
               unzip \
               wget \
               xz-utils \
               libssl-dev
            # we have libopus compiled by us.
            apt-get remove -y libopus-dev || true
            # output devs
            ls -l ./
            tree -L 3 /opt/artifacts/vcpkg/installed
          run: |
            # disable git safe.directory
            git config --global --add safe.directory "*"
            # rust
            pushd /opt
            # do not use rustup, because memory overflow in qemu
            wget -O rust.tar.gz https://static.rust-lang.org/dist/rust-${{env.RUST_TOOLCHAIN_VERSION}}-x86_64-unknown-linux-gnu.tar.gz
            tar -zxvf rust.tar.gz > /dev/null && rm rust.tar.gz
            cd rust-${{env.RUST_TOOLCHAIN_VERSION}}-x86_64-unknown-linux-gnu && ./install.sh
            rm -rf rust-${{env.RUST_TOOLCHAIN_VERSION}}-x86_64-unknown-linux-gnu
            # edit config
            mkdir -p ~/.cargo/
            echo """
              [source.crates-io]
              registry = 'https://github.com/rust-lang/crates.io-index'
            """ > ~/.cargo/config
            cat ~/.cargo/config
            # start build
            pushd /workspace
            export VCPKG_ROOT=/opt/artifacts/vcpkg
            # use the .so built on the runner; build.py checks it is the pinned checkout
            export DRMTAP_PREBUILT_DIR=/workspace/third_party/libdrmtap/build-pkg
            # ask build.py for the features so this line and the packaging line cannot drift
            FEATURES=$(python3 ./build.py --flutter --drm --hwcodec --unix-file-copy-paste --print-features)
            # an empty or error-shaped value would silently build a stock binary
            for want in drm drm-wake; do
              case ",$FEATURES," in
                *",$want,"*) ;;
                *) echo "::error::build.py returned no '$want' feature: $FEATURES"; exit 1 ;;
              esac
            done
            # Run the drm-gated unit tests HERE, because nowhere else does. The ordinary linux CI
            # runs the suite, but `drm` is opt-in, so every test behind that feature -- the cursor
            # rotation and hotspot ones especially -- has no continuous coverage at all otherwise.
            # Debug rather than --release: these are pure logic tests and the release build is
            # already the slow part of this job.
            # A MINIMAL feature set, not the production $FEATURES: these are pure logic tests of
            # the drm paths, and pulling hwcodec in makes the test binary fail to link at all
            # (undefined reference to fcntl64 in this container), so the tests never run.
            #
            # Two packages, because `cargo test --lib` at the root builds the ROOT package only:
            # the provenance tests live in libs/scrap and would never be selected from here. The
            # ordinary linux CI runs --workspace but without the drm feature, so these are not
            # covered there either.
            #
            # awk sums the counts rather than bc, which this container does not install.
            #
            # A cargo test FILTER that matches nothing exits 0, so a rename would turn this into a
            # green no-op. Assert each command actually ran something.
            run_drm_tests() {
              local desc="$1"; shift
              local out
              out=$("$@" 2>&1) || { echo "$out"; echo "::error::drm tests failed: $desc"; exit 1; }
              local ran
              ran=$(echo "$out" | awk '/^running [0-9]+ tests?$/ { n += $2 } END { print n+0 }')
              echo "$desc ran $ran tests"
              if [ "$ran" -lt 1 ]; then
                echo "::error::$desc selected no tests; it was renamed or removed"
                exit 1
              fi
            }
            run_drm_tests "rustdesk drm_capturer_tests" \
              cargo test --locked --lib --features drm drm_capturer_tests
            run_drm_tests "rustdesk ipc::test" \
              cargo test --locked --lib --features drm ipc::test
            run_drm_tests "rustdesk cursor_pos_tests" \
              cargo test --locked --lib --features drm cursor_pos_tests
            run_drm_tests "rustdesk peer_abs_sample_tests" \
              cargo test --locked --lib --features drm peer_abs_sample_tests
            run_drm_tests "rustdesk input_map_tests" \
              cargo test --locked --lib --features drm input_map_tests
            run_drm_tests "rustdesk drm_pacing_tests" \
              cargo test --locked --lib --features drm drm_pacing_tests
            run_drm_tests "scrap hotspot_provenance_tests" \
              cargo test --locked -p scrap --features drm hotspot_provenance_tests
            run_drm_tests "scrap hotspot_guess_tests" \
              cargo test --locked -p scrap --features drm hotspot_guess_tests
            run_drm_tests "scrap crtc_refresh_tests" \
              cargo test --locked -p scrap --features drm crtc_refresh_tests
            run_drm_tests "scrap plane_rotation_tests" \
              cargo test --locked -p scrap --features drm plane_rotation_tests
            run_drm_tests "scrap drmtap_dl::tests" \
              cargo test --locked -p scrap --features drm drmtap_dl::tests
            # Opt-in like drm, and this container already builds with it.
            run_drm_tests "clipboard unix-file-copy-paste" \
              cargo test --locked -p clipboard --features unix-file-copy-paste
            run_drm_tests "XN remote sleep message authorization" cargo test --locked --lib --features drm remote_sleep_request_is_scoped_to_remote_desktop
            cargo build --locked --lib --features "$FEATURES" --release
            rm -rf target/release/deps target/release/build
            rm -rf ~/.cargo

            # Setup Flutter
            # disable git safe.directory
            git config --global --add safe.directory "*"
            export PATH=/opt/flutter/bin:$PATH
            pushd /opt
            wget https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${{ env.FLUTTER_VERSION }}-stable.tar.xz
            tar xf flutter_linux_${{ env.FLUTTER_VERSION }}-stable.tar.xz
            flutter doctor -v

            if [[ "3.24.5" == ${{ env.FLUTTER_VERSION }} ]]; then
              pushd /opt/flutter
              git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
              popd
            fi

            # build flutter
            pushd /workspace
            export CARGO_INCREMENTAL=0
            export DEB_ARCH=amd64
            python3 ./build.py --flutter --drm --hwcodec --unix-file-copy-paste --skip-cargo
            for name in rustdesk*??.deb; do
              mv "$name" "${name%%.deb}-x86_64.deb"
            done

      # build.py can exit 0 on some inner failures, so check the artifact rather than the status.
      # The package name is the informed consent for consent-free capture, so a stock binary must
      # never ship under it: assert the bundled library AND the dlopen path in the binary.
      - name: Check the deb is a drm build
        run: |
          set -euo pipefail
          # Resolve by glob, not from env.VERSION: build.py names the deb from Cargo.toml, so a
          # hardcoded name fails with a bare exit 1 the first time those two drift.
          shopt -s nullglob
          debs=(rustdesk-unattended-wayland-*-x86_64.deb)
          if [ "${#debs[@]}" -ne 1 ]; then
            echo "::error::expected one rustdesk-unattended-wayland-*-x86_64.deb, found ${#debs[@]}: ${debs[*]-none}"
            exit 1
          fi
          deb="${debs[0]}"
          echo "DRM_DEB=$deb" >> "$GITHUB_ENV"
          contents="$(dpkg -c "$deb")"
          if [[ ! "$contents" =~ usr/lib/rustdesk/libdrmtap\.so\.0\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::$deb has no versioned libdrmtap.so.0.x.y"
            exit 1
          fi
          if [[ "$contents" != *"usr/lib/rustdesk/libdrmtap.so.0 ->"* ]]; then
            echo "::error::$deb has no libdrmtap.so.0 soname symlink"
            exit 1
          fi
          rm -rf /tmp/deb && dpkg-deb -R "$deb" /tmp/deb
          if ! grep -qF /usr/lib/rustdesk/libdrmtap.so.0 /tmp/deb/usr/share/rustdesk/lib/librustdesk.so; then
            echo "::error::$deb was not built with the drm feature"
            exit 1
          fi
        shell: bash

      - name: Record verified build provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$XN_INTEGRATION_SHA"
          test "$(git diff --name-only "$XN_INTEGRATION_SHA" HEAD)" = .github/workflows/ci.yml
          test "$(dpkg-deb -f "$DRM_DEB" Package)" = rustdesk-unattended-wayland
          test "$(dpkg-deb -f "$DRM_DEB" Architecture)" = amd64
          test "$(dpkg-deb -f "$DRM_DEB" Version)" = 1.5.3
          mkdir -p build-evidence
          sha256sum "$DRM_DEB" > build-evidence/SHA256SUMS
          printf "%s\n" "$XN_INTEGRATION_SHA" > build-evidence/integration-commit.txt
          printf "%s\n" "$GITHUB_SHA" > build-evidence/workflow-commit.txt
          git submodule status --recursive > build-evidence/submodules.txt
      - name: Upload verified unattended DEB
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: xn-wayland-deb-${{ env.XN_INTEGRATION_SHA }}
          if-no-files-found: error
          path: |
            ${{ env.DRM_DEB }}
            build-evidence/
