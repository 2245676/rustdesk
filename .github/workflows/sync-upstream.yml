name: XN upstream candidate tracking

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Observe a candidate or update upstream metadata
        type: choice
        options:
          - plan
          - apply
        default: plan
        required: true

permissions: {}

concurrency:
  group: xn-upstream-tracking
  cancel-in-progress: false

jobs:
  plan:
    if: >-
      github.repository == '2245676/rustdesk' &&
      github.ref == 'refs/heads/master' &&
      github.event_name == 'workflow_dispatch' &&
      (inputs.mode || 'plan') == 'plan'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out only the trusted scheduler commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false
          fetch-depth: 1
      - name: Observe candidate without writing remote refs
        env:
          XN_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: python3 -B scripts/xn/sync_upstream.py --mode plan --report "$RUNNER_TEMP/xn-sync/report.json"
      - name: Save candidate report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upstream-candidate-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/xn-sync/report.json
          retention-days: 7
          if-no-files-found: error

  apply:
    if: >-
      github.repository == '2245676/rustdesk' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.mode == 'apply'))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Check out only the trusted scheduler commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false
          fetch-depth: 1
      - name: Update only the metadata tracking ref
        env:
          XN_WORKFLOW_SHA: ${{ github.workflow_sha }}
          XN_GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B scripts/xn/sync_upstream.py --mode apply --report "$RUNNER_TEMP/xn-sync/report.json"
      - name: Save candidate report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upstream-candidate-apply-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/xn-sync/report.json
          retention-days: 7
          if-no-files-found: error
